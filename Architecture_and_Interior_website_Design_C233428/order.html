<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="my-4">Order List</h1>

        <!-- Editable Fields for editing a selected row (Initially hidden) -->
        <div id="editSection" class="mb-4" style="display: none;">
            <h4>Edit Order</h4>
            <div class="form-group">
                <label for="editName">Name</label>
                <input type="text" class="form-control" id="editName">
            </div>
            <div class="form-group">
                <label for="editAddress">Address</label>
                <input type="text" class="form-control" id="editAddress">
            </div>
            <div class="form-group">
                <label for="editPhone">Phone</label>
                <input type="text" class="form-control" id="editPhone">
            </div>
            <button class="btn btn-primary" id="saveChangesButton">Save Changes</button>
            <button class="btn btn-secondary" id="cancelEditButton">Cancel</button>
        </div>

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Package Name</th>
                    <th>Package Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orderTableBody">
                <!-- Order data will be dynamically inserted here -->
            </tbody>
        </table>

        <nav>
            <ul class="pagination justify-content-center" id="paginationControls">
                <!-- Pagination buttons will be dynamically inserted here -->
            </ul>
        </nav>

        <a href="/" class="btn btn-primary">Back to Insert</a>
    </div>

    <script>
        let currentPage = 1;
        const limit = 5;
        let selectedOrderId = null;

        // Fetch orders from the server
        function fetchOrders(page) {
            fetch(`/api/orders?page=${page}&limit=${limit}`)
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById("orderTableBody");
                    const paginationControls = document.getElementById("paginationControls");

                    // Clear the table and pagination controls
                    tableBody.innerHTML = "";
                    paginationControls.innerHTML = "";

                    // Populate the table with orders
                    data.orders.forEach(order => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${order.name}</td>
                            <td>${order.address}</td>
                            <td>${order.phone}</td>
                            <td>${order.package_name}</td>
                            <td>${order.package_price}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="openEditForm('${order._id}', '${order.name}', '${order.address}', '${order.phone}')">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteOrder('${order._id}')">Delete</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });

                    // Pagination
                    if (data.total_records > limit) {
                        for (let i = 1; i <= data.total_pages; i++) {
                            const isActive = (i === currentPage) ? 'active' : null;
                            const button = document.createElement("li");
                            button.className = `page-item ${isActive}`;
                            button.innerHTML = `<a class="page-link" href="#" onclick="navigatePage(${i})">${i}</a>`;
                            paginationControls.appendChild(button);
                        }
                    }
                })
                .catch(error => console.error("Error fetching orders:", error));
        }

        // Open the edit form with selected order's data
        function openEditForm(orderId, name, address, phone) {
            selectedOrderId = orderId;

            // Populate the form with the order data
            document.getElementById('editName').value = name;
            document.getElementById('editAddress').value = address;
            document.getElementById('editPhone').value = phone;

            // Show the edit form
            document.getElementById('editSection').style.display = 'block';
        }

        // Save changes to the order
        document.getElementById('saveChangesButton').addEventListener('click', function() {
            if (selectedOrderId) {
                const updatedOrder = {
                    name: document.getElementById('editName').value,
                    address: document.getElementById('editAddress').value,
                    phone: document.getElementById('editPhone').value
                };

                fetch(`/api/orders/${selectedOrderId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedOrder)
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);  // Show success message
                    fetchOrders(currentPage);  // Refresh the order list
                    selectedOrderId = null; // Reset selected order ID
                    // Clear the input fields
                    document.getElementById('editName').value = '';
                    document.getElementById('editAddress').value = '';
                    document.getElementById('editPhone').value = '';
                    document.getElementById('editSection').style.display = 'none'; // Hide the edit form
                })
                .catch(error => console.error("Error updating order:", error));
            }
        });

        // Cancel editing and hide the form
        document.getElementById('cancelEditButton').addEventListener('click', function() {
            document.getElementById('editSection').style.display = 'none'; // Hide the edit form
        });

        // Delete an order
        function deleteOrder(orderId) {
            if (confirm("Are you sure you want to delete this order?")) {
                fetch(`/api/orders/${orderId}`, {
                    method: 'DELETE',
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    fetchOrders(currentPage);  // Refresh the order list
                })
                .catch(error => console.error("Error deleting order:", error));
            }
        }

        // Handle pagination
        function navigatePage(page) {
            currentPage = page;
            fetchOrders(currentPage);
        }

        // Initial fetch of orders
        fetchOrders(currentPage);
    </script>
</body>
</html>
