{% extends "base.html" %}

{% block title %}Update Employee Records{% endblock title %}

{% block content %}
<div class="col-md-12">
    <form method="POST" class="post-form" action="{% url 'update' employee.id %}">  
    {% csrf_token %}  
    <div class="container">   
        <div class="col-12">  
            <h3>Update Details</h3>  
        </div> 
        <div class="mb-3"> 
            <label>Employee ID:</label>  
            <input type="text" class="form-control" name="id" id="id_id" value="{{ employee.id }}" readonly />    
        </div> 
        <div class="mb-3"> 
            <label>Name:</label>  
            <input type="text" class="form-control" name="name" id="id_name" required maxlength="100" value="{{ employee.name }}" />  
        </div> 
        <div class="mb-3"> 
            <label>Email:</label>  
            <input type="email" class="form-control" name="email" id="id_email" required maxlength="254" value="{{ employee.email }}" />  
        </div> 
        <div class="mb-3"> 
            <label>Contact:</label>  
            <input type="text" class="form-control" name="contact" id="id_contact" required maxlength="15" value="{{ employee.contact }}" />  
        </div> 
        <div class="mb-3"> 
            <label>Package Name:</label>  
            <select id="packageSelect" class="form-control" name="package_name">
                <option value="Low Package" {% if employee.package_name == "Low Package" %}selected{% endif %}>Low Package</option>
                <option value="Medium Package" {% if employee.package_name == "Medium Package" %}selected{% endif %}>Medium Package</option>
                <option value="High Package" {% if employee.package_name == "High Package" %}selected{% endif %}>High Package</option>
            </select>
        </div>
        <div class="mb-3"> 
            <label>Price:</label>  
            <input type="text" id="priceField" class="form-control" name="price" value="{{ employee.price }}" readonly />  
        </div>
        <div class="mb-3"> 
            <button type="submit" class="btn btn-success btn-lg">Update</button>  
        </div> 
    </div>  
    </form>  
</div> 

<script>
    document.getElementById('packageSelect').addEventListener('change', function() {
        const packagePrices = {
            "Low Package": 50,
            "Medium Package": 100,
            "High Package": 150
        };

        // Get the selected package name
        const selectedPackage = this.value;

        // Update the price field with the corresponding price
        document.getElementById('priceField').value = packagePrices[selectedPackage] || '';
    });
</script>
{% endblock content %}
