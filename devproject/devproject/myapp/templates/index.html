{% extends "base.html" %}

{% block title %}Add New Employee Records{% endblock title %}

{% block content %}

<div class="container">
    <div class="col-md-12">    
        <form method="POST" class="post-form" action="{% url 'addnew' %}">  
        {% csrf_token %}  
        <div class="container">  
            <div class="mb-3"> 
                <label>Name:</label>  
                {{ form.name }}   
            </div> 
            <div class="mb-3"> 
                <label>Email:</label>  
                {{ form.email }}   
            </div>  
            <div class="mb-3"> 
                <label>Contact:</label>  
                {{ form.contact }}   
            </div>
            <div class="mb-3"> 
                <label>Package Name:</label>  
                <select id="packageSelect" class="form-control" name="package_name">
                    <option value="" selected disabled>Select a Package</option>
                    <option value="Low Package">Low Package</option>
                    <option value="Medium Package">Medium Package</option>
                    <option value="High Package">High Package</option>
                </select>
            </div>
            <div class="mb-3"> 
                <label>Price:</label>  
                <input type="text" id="priceField" class="form-control" name="price" readonly />  
            </div>
            <div class="mb-3"> 
                <button type="submit" class="btn btn-primary">Submit</button>    
            </div> 
        </div>  
        </form>  
    </div>
</div>

<script>
    document.getElementById('packageSelect').addEventListener('change', function() {
        const packagePrices = {
            "Low Package": 50,
            "Medium Package": 100,
            "High Package": 150
        };

        // Get the selected package name
        const selectedPackage = this.value;

        // Update the price field with the corresponding price
        document.getElementById('priceField').value = packagePrices[selectedPackage] || '';
    });
</script>

{% endblock content %}
